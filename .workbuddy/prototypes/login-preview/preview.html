<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>登录页预览 · My Travel Map</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #EFE9E1; color: #2B2621;
  }
  #bar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 9px 16px;
    background: rgba(255, 255, 255, .74);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(0, 0, 0, .06);
    position: sticky; top: 0; z-index: 10;
  }
  #bar .t { font-size: 13px; font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
  #bar .dim { font-size: 12px; color: #938a7e; min-width: 112px; text-align: right; font-variant-numeric: tabular-nums; margin-left: auto; }
  #sizes { display: flex; gap: 6px; }
  #sizes button {
    border: 0; background: #fff; color: #5b544b;
    padding: 7px 13px; border-radius: 999px; font-size: 12.5px; cursor: pointer;
    box-shadow: 0 1px 2px rgba(60, 50, 40, .10);
    transition: background .18s, color .18s, transform .18s;
    white-space: nowrap;
  }
  #sizes button:hover { transform: translateY(-1px); }
  #sizes button[aria-pressed="true"] { background: #7C9CC3; color: #fff; box-shadow: 0 4px 12px rgba(124, 156, 195, .45); }

  #artw-ctl {
    display: flex; align-items: center; gap: 8px;
    font-size: 12.5px; color: #5b544b; white-space: nowrap;
    padding: 0 12px; border-left: 1px solid rgba(0,0,0,.08); border-right: 1px solid rgba(0,0,0,.08);
  }
  #artw { width: 168px; accent-color: #7C9CC3; }
  #artwv { font-variant-numeric: tabular-nums; color: #938a7e; min-width: 52px; }

  #wrap { height: calc(100% - 55px); position: relative; overflow: hidden; }
  #stage {
    position: absolute; left: 50%; top: 50%;
    transform-origin: center center;
    background: #FBF6F0;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(60, 50, 40, .22), 0 2px 8px rgba(60, 50, 40, .10);
    transition: width .3s cubic-bezier(.16, 1, .3, 1), height .3s cubic-bezier(.16, 1, .3, 1);
  }
  #stage iframe { width: 100%; height: 100%; border: 0; display: block; }
  @media (max-width: 720px) {
    #bar .t { width: 100%; }
    #artw { width: 110px; }
    #sizes { width: 100%; overflow-x: auto; }
    #bar .dim { margin-left: 0; }
  }
</style>
</head>
<body>
  <div id="bar">
    <span class="t">登录页 · 插画预览</span>
    <div id="artw-ctl">
      <label for="artw">插画大小</label>
      <input type="range" id="artw" min="760" max="1960" step="20" value="1400" />
      <output id="artwv">1400px</output>
    </div>
    <span class="dim" id="dim">—</span>
    <div id="sizes"></div>
  </div>

  <div id="wrap">
    <div id="stage"><iframe id="fr" src="./frame.html" title="登录页预览"></iframe></div>
  </div>

<script>
  const SIZES = [
    { k: 'userwin',  label: '你的窗口 1920×916', w: 1920, h: 916 },
    { k: 'desktop',  label: '桌面 1920×1080',   w: 1920, h: 1080 },
    { k: 'shortwin', label: '宽屏矮窗 1512×700', w: 1512, h: 700 },
    { k: 'laptop',   label: '笔记本 1440×900',  w: 1440, h: 900 },
    { k: 'tablet',   label: '平板 768×1024',    w: 768,  h: 1024 },
    { k: 'mobile',   label: '手机 390×844',     w: 390,  h: 844 },
  ];
  const stage = document.getElementById('stage');
  const wrap  = document.getElementById('wrap');
  const dim   = document.getElementById('dim');
  const box   = document.getElementById('sizes');
  const fr    = document.getElementById('fr');
  const artw  = document.getElementById('artw');
  const artwv = document.getElementById('artwv');
  let current = 'userwin';

  SIZES.forEach((s) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = s.label;
    b.dataset.k = s.k;
    b.addEventListener('click', () => { current = s.k; render(); });
    box.appendChild(b);
  });

  // 把「插画大小」作为 CSS 变量注入 iframe 文档根（同源，可直接改）
  function applyArtW() {
    const doc = fr.contentDocument;
    if (doc && doc.documentElement) {
      doc.documentElement.style.setProperty('--tm-login-art-w', artw.value + 'px');
    }
    artwv.textContent = artw.value + 'px';
  }

  function render() {
    const s = SIZES.find((x) => x.k === current) || SIZES[0];
    [...box.children].forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.k === s.k)));

    stage.style.width  = s.w + 'px';
    stage.style.height = s.h + 'px';

    const pad = 36;
    const scale = Math.min(1,
      (wrap.clientWidth  - pad) / s.w,
      (wrap.clientHeight - pad) / s.h);
    stage.style.transform = `translate(-50%, -50%) scale(${scale})`;

    dim.textContent = `${s.w} × ${s.h}${scale < 0.995 ? '  ·  ' + Math.round(scale * 100) + '%' : ''}`;
  }

  artw.addEventListener('input', applyArtW);
  fr.addEventListener('load', () => { applyArtW(); });
  addEventListener('resize', render);

  render();
  applyArtW();
</script>
</body>
</html>
