<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>地标护照印章 · 样例（生成式，无图片素材）</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(120% 90% at 50% 0%,#fbf7ef,#ece1cf 72%);
       font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:#4a4137;}
  h1{font-size:16px;font-weight:700;margin:22px auto 4px;max-width:772px;padding:0 6px;}
  p.note{font-size:12px;color:#7d7365;margin:0 auto 18px;line-height:1.65;max-width:772px;padding:0 6px;}
  .page{max-width:772px;background:linear-gradient(180deg,#f8f2e7,#f2e9db);border:1px solid #ddcfb6;border-radius:14px;
        margin:0 auto 30px;padding:22px 22px 26px;
        box-shadow:0 6px 22px rgba(74,60,44,.14), inset 0 0 0 1px rgba(255,255,255,.55);}
  .page h2{font-size:12px;letter-spacing:2.5px;color:#8a7d68;font-weight:700;margin:0 0 20px;text-transform:uppercase;}
  .grid{display:grid;grid-template-columns:repeat(4,148px);gap:26px 22px;justify-content:center;}
  .stamp{width:148px;height:148px;filter:drop-shadow(0 3px 4px rgba(74,60,44,.18));}
  .stamp svg{width:100%;height:100%;overflow:visible;}
  .ink{mix-blend-mode:multiply;}
  .lm{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .lbl-cn{font-weight:800;}
  .lbl-city{font-family:Georgia,"Times New Roman",serif;letter-spacing:.3px;font-weight:700;}
</style>
</head>
<body>
<h1>地标护照印章墙 · 样例（全部由代码生成，无手绘 / 无图片素材）</h1>
<p class="note">每枚 = 独立剪影外框（含虚点内边框）× 地标图形（纯 SVG 几何重绘）× 国家·城市标签 × 各国专属墨色 × 固定随机歪斜 + 程序化墨水噪点。地标全部是矢量几何，不使用任何图片素材，调参即可改风格。</p>
<div class="page">
  <h2>Passport · Stamps</h2>
  <div class="grid" id="grid"></div>
</div>

<svg width="0" height="0" style="position:absolute">
  <filter id="ink" x="-25%" y="-25%" width="150%" height="150%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
  </filter>
</svg>

<script>
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
const rot = s => (hash(s)%13)-6;
const cid = s => 'p'+s.replace(/[^A-Za-z]/g,'');

/* ---------- 外框剪影：统一占 y14..88 / x16..84，只改轮廓 ---------- */
function scallop(cx,cy,R,lobes){
  const st=Math.PI*2/lobes, rIn=R*0.9, rOut=R*1.08; let d='';
  for(let i=0;i<lobes;i++){
    const a0=i*st,a1=(i+1)*st,am=(a0+a1)/2;
    const x0=cx+rIn*Math.cos(a0),y0=cy+rIn*Math.sin(a0);
    const x1=cx+rIn*Math.cos(a1),y1=cy+rIn*Math.sin(a1);
    const xc=cx+rOut*Math.cos(am),yc=cy+rOut*Math.sin(am);
    if(!i)d+=`M${x0.toFixed(1)} ${y0.toFixed(1)} `;
    d+=`Q${xc.toFixed(1)} ${yc.toFixed(1)} ${x1.toFixed(1)} ${y1.toFixed(1)} `;
  }
  return d+'Z';
}
const FRAMES = {
  seal:    'M31 14 H69 Q82 14 82 31 V71 Q82 88 69 88 H31 Q18 88 18 71 V31 Q18 14 31 14 Z', // 中国·印章方
  gable:   'M24 88 V42 L50 15 L76 42 V88 Z',                                              // 日本·屋脊
  scallop: scallop(50,51,36,20),                                                          // 希腊·扇贝圆
  octagon: 'M34 14 H66 L84 32 V70 L66 88 H34 L16 70 V32 Z',                               // 美国·八边贴纸
  bell:    'M26 88 V40 A24 24 0 0 1 74 40 V88 Z',                                         // 英国·窄拱顶
  ogee:    'M26 88 V46 C26 30 38 17 50 14 C62 17 74 30 74 46 V88 Z',                      // 法国·尖拱
  dome:    'M17 88 V52 A33 33 0 0 1 83 52 V88 Z',                                         // 澳洲·宽穹顶
  circle:  'M50 14 A37 37 0 1 1 50 88 A37 37 0 1 1 50 14 Z'                              // 意大利·圆章
};

/* ---------- 地标：纯几何，落在 x30..70 / y22..58 ---------- */
const LM = {
  china:`<g class="lm"><path d="M34 57 Q50 45 66 57"/><path d="M37.5 49 Q50 38 62.5 49"/>
    <path d="M41 41 Q50 31 59 41"/><path d="M50 31 V25.5"/><circle cx="50" cy="24" r="2.2"/>
    <path d="M37 57 H63"/></g>`,
  japan:`<g class="lm"><path d="M37 58 H63 L58.5 51 H41.5 Z"/><path d="M40 51 H60 L56 44.5 H44 Z"/>
    <path d="M43 44.5 H57 L54 39 H46 Z"/><rect x="46" y="32" width="8" height="7"/>
    <path d="M50 32 V26.5"/><circle cx="50" cy="25" r="1.8"/><path d="M39 58 H61"/></g>`,
  santorini:`<g class="lm"><path d="M34 44 A9 9 0 0 1 52 44"/><path d="M43 35 V28 M39.2 30.8 H46.8"/>
    <path d="M34 44 V58 M52 44 V58"/><path d="M38.5 50 V56 M47.5 50 V56"/>
    <path d="M55 52 A5 5 0 0 1 65 52"/><path d="M55 52 V58 M65 52 V58"/>
    <path d="M31 58 H67"/></g>`,
  ny:`<g class="lm"><path d="M45 35 C42.5 43 41.5 51 40.5 58 L59.5 58 C58.5 51 57.5 43 55 35 Z"/>
    <circle cx="50" cy="30" r="3.1"/>
    <path d="M47.2 28.2 L45.8 24.4 M49.2 27.2 L48.8 23.4 M50.8 27.2 L51.2 23.4 M52.8 28.2 L54.2 24.4"/>
    <path d="M54 36 L57.4 27.5"/><path d="M55.4 27.5 L59.4 27.5 L58.6 24.6 L56.2 24.6 Z"/>
    <path d="M57.4 23.6 C58.8 22.2 58.8 21 57.4 19.8"/><path d="M45 37 L43.2 46"/>
    <rect x="40.8" y="45" width="4.8" height="6.6" rx="1"/></g>`,
  london:`<g class="lm"><path d="M43 33 A7 7 0 0 1 57 33 L57 58 L43 58 Z"/>
    <path d="M50 24 V28"/><path d="M45.4 25.6 H54.6"/>
    <rect x="45.6" y="37" width="8.8" height="10.5" rx="1"/><path d="M50 37 V47.5 M45.6 42.2 H54.4"/>
    <rect x="45.6" y="50" width="8.8" height="8"/><path d="M50 50 V58"/></g>`,
  paris:`<g class="lm"><path d="M37 58 C41 48 44.5 37 45.5 29 L54.5 29 C55.5 37 59 48 63 58"/>
    <path d="M44.5 29 H55.5"/><path d="M40.5 42 H59.5"/><path d="M38 51 H62"/>
    <path d="M41.5 55 Q50 50 58.5 55"/><path d="M50 29 V24"/><path d="M46 36 H54"/><path d="M44.5 46 H55.5"/></g>`,
  sydney:`<g class="lm"><path d="M33 58 C36 44 41 35 47 30 C47 40 46 50 45 58 Z"/>
    <path d="M43 58 C46 40 53 31 60 27 C59 39 56 50 54 58 Z"/>
    <path d="M55 58 C57 50 60 45 65 43 C64 49 62 54 61 58 Z"/><path d="M31 58 H67"/></g>`,
  italy:`<g class="lm" transform="rotate(-7 50 46)"><rect x="45.4" y="38" width="9.2" height="20" rx="2"/>
    <rect x="44" y="31.5" width="12" height="6.5" rx="2"/>
    <path d="M45.4 44 H54.6 M45.4 49 H54.6 M45.4 54 H54.6"/><path d="M50 28.5 V31.5"/></g>`
};

const DATA = [
  {cn:'中国',     city:'BEIJING',   yr:2016, ink:'#B23A2E', frame:'seal',    lm:'china'},
  {cn:'日本',     city:'KYOTO',     yr:2018, ink:'#A8474B', frame:'gable',   lm:'japan'},
  {cn:'希腊',     city:'THIRA',     yr:2019, ink:'#2F6FB0', frame:'scallop', lm:'santorini'},
  {cn:'美国',     city:'NEW YORK',  yr:2017, ink:'#2E8B84', frame:'octagon', lm:'ny'},
  {cn:'英国',     city:'LONDON',    yr:2015, ink:'#C0392B', frame:'bell',    lm:'london'},
  {cn:'法国',     city:'PARIS',     yr:2014, ink:'#8A6A3B', frame:'ogee',    lm:'paris'},
  {cn:'澳大利亚', city:'SYDNEY',    yr:2021, ink:'#2C7FB8', frame:'dome',    lm:'sydney'},
  {cn:'意大利',   city:'PISA',      yr:2022, ink:'#B4653A', frame:'circle',  lm:'italy'},
];

function stampSVG(d){
  const id=cid(d.city), r=rot(d.city+d.cn);
  return `
  <div class="stamp" style="transform:rotate(${r}deg)">
  <svg viewBox="-5 -5 110 110">
    <g class="ink">
      <path d="${FRAMES[d.frame]}" fill="${d.ink}" fill-opacity="0.07" stroke="none"/>
      <path d="${FRAMES[d.frame]}" fill="none" stroke="${d.ink}" stroke-width="3.2" filter="url(#ink)"/>
      <path d="${FRAMES[d.frame]}" transform="translate(50 51) scale(0.85) translate(-50 -51)"
            fill="none" stroke="${d.ink}" stroke-width="1.8" stroke-dasharray="1.2 4"
            stroke-opacity="0.9" filter="url(#ink)"/>
      <g stroke="${d.ink}" filter="url(#ink)" transform="translate(50 41) scale(1.12) translate(-50 -41)">${LM[d.lm]}</g>
      <path d="M38 62 H62" stroke="${d.ink}" stroke-width="1.4" stroke-opacity="0.65" fill="none"/>
      <text class="lbl-cn" x="50" y="69.8" fill="${d.ink}" font-size="12.5" text-anchor="middle">${d.cn}</text>
      <text class="lbl-city" x="50" y="76.2" fill="${d.ink}" font-size="5.4" text-anchor="middle" opacity="0.9">${d.city} · ${d.yr}</text>
    </g>
  </svg>
  </div>`;
}
document.getElementById('grid').innerHTML = DATA.map(stampSVG).join('');
</script>
</body>
</html>
